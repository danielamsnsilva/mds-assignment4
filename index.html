<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLOW/LAB — Kanban &amp; flow metrics</title>
  </head>
  <body>
    <form id="access-form">
      <label for="password">Introduza a palavra-passe para aceder ao FLOW/LAB:</label>
      <input id="password" name="password" type="password" required autofocus />
      <button type="submit">Aceder</button>
      <p id="access-message" role="alert" hidden></p>
    </form>

    <script>
      const form = document.getElementById("access-form");
      const passwordInput = document.getElementById("password");
      const message = document.getElementById("access-message");
      const submitButton = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.hidden = true;
        submitButton.disabled = true;

        try {
          const response = await fetch("/.netlify/functions/authenticate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
          });

          if (response.ok) {
            window.location.assign("./KanbanFlowLab.html");
            return;
          }

          message.textContent =
            response.status === 401
              ? "Palavra-passe incorreta."
              : "Não foi possível verificar o acesso. Tente novamente mais tarde.";
        } catch {
          message.textContent = "Não foi possível contactar o servidor. Tente novamente.";
        }

        message.hidden = false;
        passwordInput.value = "";
        passwordInput.focus();
        submitButton.disabled = false;
      });
    </script>
  </body>
</html>
